name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: CUDA, frontend, and backend
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the supported CUDA container
        run: docker build -t mumax3-build -f amumax/Dockerfile .

      - name: Build CUDA kernels in the supported container
        env:
          CUDA_CC: 50 52 53 60 61 62 70 72 75 80 86 87 89 90
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e GOPATH=/tmp/go -e GOCACHE=/tmp/go-cache -e CUDA_CC \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            mumax3-build make cudakernels

      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run test:unit
          npm run build

      - name: Embed frontend in the web UI
        run: |
          rm -rf webui/static
          cp -R frontend/dist webui/static

      - name: Test and compile backend in the supported container
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e GOPATH=/tmp/go -e GOCACHE=/tmp/go-cache \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            mumax3-build sh -ceu '
              mkdir -p /tmp/cuda-stubs
              ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /tmp/cuda-stubs/libcuda.so.1
              export LD_LIBRARY_PATH=/tmp/cuda-stubs:/usr/local/cuda/lib64
              go test -vet=off ./cmd/mumax3
              go build ./cmd/mumax3
            '
